  <p class="eyebrow">实验</p>
  <h1>光标画布</h1>
  <p class="lede">这个页面本身就是它：几只光标在屏幕上自己动，滚动的时候顺手把内容框出来。</p>
  <p>最早的想法很简单——如果内容不是「淡入」出来，而是被谁用手框出来，会不会更有意思。</p>
  <p>所以做了三个光标：夏乌拉、Dandan008、大肥鱼。它们各自领一块内容，从对角拉一个虚线框，框合上的那一刻内容才蹦出来。</p>
  <p>后来加了右下角的时钟和开关：关掉之后，光标会走回屏幕右边的监视塔里待着，页面就安静了。</p>
